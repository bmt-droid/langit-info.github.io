<!doctype html>
<html lang="id" translate="no">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3E8FD8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Langit">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Langit: prakiraan cuaca Indonesia per jam, mode jemuran, petani, nelayan dan wisata. Data Open-Meteo dan BMKG.">
<title>Langit — Cuaca Indonesia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F6F8F9; --ink:#16212C; --muted:#5D6B79; --line:#DDE3E8; --soft:#E7ECF0;
  --rain:#2C6BD9; --focus:#2C6BD9;
  --good:#2FA866; --ok:#E2B23A; --poor:#EE8B3A; --bad:#D9534F;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,-apple-system,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#111923; --ink:#E6EDF3; --muted:#93A2B1; --line:#243241; --soft:#1E2A37;
    --rain:#6EA8FF; --focus:#6EA8FF; --good:#47C47F; --ok:#EBC250; --poor:#F29A52; --bad:#E66A63;
  }
}
:root[data-theme="dark"]{
  --paper:#111923; --ink:#E6EDF3; --muted:#93A2B1; --line:#243241; --soft:#1E2A37;
  --rain:#6EA8FF; --focus:#6EA8FF; --good:#47C47F; --ok:#EBC250; --poor:#F29A52; --bad:#E66A63;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html,body{overflow-x:hidden;overflow-x:clip}
/* grid and flex children default to min-width:auto, which lets wide strips stretch the page */
.layout > *, .mode-panel > *, .verdict > *, .strip-wrap, .fact, .tile, .hero > *, section{min-width:0}
.verdict h2, .verdict p, .fact p, .lead, .note{overflow-wrap:anywhere}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.5 var(--body);-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:8px}
.sky :focus-visible{outline-color:currentColor}
.wrap{max-width:1120px;margin:0 auto}

/* ---------- Sky header ---------- */
.sky{
  --sky-top:#3E8FD8; --sky-bottom:#A9D6F5; --sky-ink:#10263D;
  --glass:rgba(255,255,255,.30); --glass-line:rgba(255,255,255,.5); --glass-on:rgba(255,255,255,.62);
  background:var(--stars,linear-gradient(transparent,transparent)),linear-gradient(180deg,var(--sky-top) 0%,var(--sky-mid,var(--sky-bottom)) 55%,var(--sky-bottom) 100%);
  transition:color .4s;
  color:var(--sky-ink);
  padding:calc(env(safe-area-inset-top,0px) + 14px) 20px 80px;
}
.sky[data-time="night-clear"]{--stars:
  radial-gradient(1.2px 1.2px at 8% 18%,rgba(255,255,255,.9),transparent 60%),
  radial-gradient(1px 1px at 19% 42%,rgba(255,255,255,.7),transparent 60%),
  radial-gradient(1.4px 1.4px at 31% 12%,rgba(255,255,255,.85),transparent 60%),
  radial-gradient(1px 1px at 44% 30%,rgba(255,255,255,.6),transparent 60%),
  radial-gradient(1.2px 1.2px at 57% 8%,rgba(255,255,255,.8),transparent 60%),
  radial-gradient(1px 1px at 66% 36%,rgba(255,255,255,.65),transparent 60%),
  radial-gradient(1.5px 1.5px at 78% 16%,rgba(255,255,255,.9),transparent 60%),
  radial-gradient(1px 1px at 88% 44%,rgba(255,255,255,.6),transparent 60%),
  radial-gradient(1.2px 1.2px at 94% 10%,rgba(255,255,255,.8),transparent 60%),
  radial-gradient(1px 1px at 13% 62%,rgba(255,255,255,.45),transparent 60%),
  radial-gradient(1px 1px at 50% 56%,rgba(255,255,255,.4),transparent 60%),
  radial-gradient(1px 1px at 83% 64%,rgba(255,255,255,.4),transparent 60%)}
.sky[data-tone="dark"]{--glass:rgba(255,255,255,.12);--glass-line:rgba(255,255,255,.22);--glass-on:rgba(255,255,255,.28)}
.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:700;font-size:1.3rem;letter-spacing:-.02em;display:flex;align-items:center;gap:8px;margin-right:auto}
.brand svg{width:26px;height:26px}
.search{position:relative;order:3;flex:1 1 100%}
@media (min-width:820px){
  .brand{margin-right:0}
  .search{order:0;flex:0 1 420px;margin:0 auto}
}
.search input{
  width:100%;padding:11px 16px 11px 42px;border-radius:999px;border:1px solid var(--glass-line);
  background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);outline:none;
}
.search input::placeholder{color:inherit;opacity:.72}
.search input:focus{border-color:currentColor}
.search > svg{position:absolute;z-index:1;left:15px;top:50%;width:18px;height:18px;transform:translateY(-50%);opacity:.75;pointer-events:none}
.results{
  position:absolute;left:0;right:0;top:calc(100% + 8px);z-index:20;margin:0;padding:6px;list-style:none;
  background:var(--paper);color:var(--ink);border-radius:16px;box-shadow:0 18px 40px rgba(10,25,45,.28);
}
.results[hidden]{display:none}
.results li{padding:10px 12px;border-radius:10px;cursor:pointer;display:flex;flex-direction:column}
.results li small{color:var(--muted)}
.results li[aria-selected="true"],.results li:hover{background:var(--soft)}
.results .empty{cursor:default;color:var(--muted)}
.actions{display:flex;gap:6px;flex-wrap:wrap}
.pill{
  display:inline-flex;align-items:center;gap:6px;border:1px solid var(--glass-line);background:var(--glass);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-radius:999px;padding:9px 13px;line-height:1;
}
.pill svg{width:17px;height:17px;flex:none}
.seg{display:inline-flex;padding:3px;border-radius:999px;border:1px solid var(--glass-line);background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.seg button{border:0;background:transparent;padding:6px 10px;border-radius:999px;font-weight:600;line-height:1}
.seg button[aria-pressed="true"]{background:var(--glass-on)}
@media (max-width:420px){ #locate span{display:none} }

.hero{position:relative;display:grid;grid-template-columns:1fr auto;gap:12px 20px;align-items:start;margin-top:40px}
.greet{font-family:var(--display);font-weight:500;font-size:1.05rem;opacity:.9;margin-bottom:6px;letter-spacing:-.005em}
.place{display:flex;align-items:center;gap:6px;margin:0;font-family:var(--display);font-weight:600;font-size:clamp(1.6rem,3.6vw,2.3rem);line-height:1.1;letter-spacing:-.02em}
.star{border:0;background:transparent;padding:6px;border-radius:50%;display:inline-flex}
.star svg{width:22px;height:22px}
.star[aria-pressed="true"] path{fill:currentColor}
.sub{opacity:.8;margin-top:4px}
.temp{
  font-family:var(--display);font-weight:300;font-variation-settings:"opsz" 96;
  font-size:clamp(7rem,24vw,14rem);line-height:.84;letter-spacing:-.065em;margin:22px 0 10px -.05em;
  font-variant-numeric:tabular-nums;
}
.temp .deg{font-size:.48em;vertical-align:.72em;letter-spacing:0;font-weight:400;margin-left:.06em}
.cond{font-family:var(--display);font-size:1.6rem;font-weight:500;letter-spacing:-.01em}
.meta{display:flex;flex-wrap:wrap;gap:4px 16px;opacity:.88;margin-top:2px}
.summary{margin:16px 0 0;max-width:38ch;font-size:1.08rem;line-height:1.45}
.hero-icon{align-self:center}
.hero-icon svg{width:clamp(96px,20vw,200px);height:auto;filter:drop-shadow(0 10px 24px rgba(10,30,60,.18))}
.favs{display:flex;gap:8px;margin-top:22px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.favs:empty{display:none}
.favs button{white-space:nowrap;font-weight:600}
.modes{display:flex;gap:8px;margin-top:22px;overflow-x:auto;padding:2px 2px 4px;scrollbar-width:none}
.modes button{white-space:nowrap;font-weight:600;padding:10px 15px}
.modes button[aria-selected="true"]{background:var(--glass-on);border-color:currentColor}
.modes .mode-ico{width:22px;height:22px;flex:none;filter:drop-shadow(0 1px 1px rgba(0,0,0,.18))}
@media (max-width:820px){
  .modes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;overflow:visible;padding:2px 0 0}
  .modes button{justify-content:center;padding:11px 6px;gap:7px;min-width:0}
}
@media (max-width:420px){
  .modes button{font-size:.92rem;padding:10px 4px;gap:6px}
  .modes .mode-ico{width:20px;height:20px}
}
@media (max-width:380px){
  .modes button{flex-direction:column;gap:4px;padding:9px 4px;font-size:.88rem;border-radius:16px}
  .modes .mode-ico{width:24px;height:24px}
}
.status{margin-top:44px;font-family:var(--display);font-size:1.5rem;max-width:30ch}
.status button{margin-top:16px;font-size:1rem}

/* ---------- Sheet ---------- */
.sheet{position:relative;margin-top:-46px;background:var(--paper);border-radius:30px 30px 0 0;padding:30px 20px calc(48px + env(safe-area-inset-bottom,0px))}
.sheet.loading{opacity:.45;transition:opacity .2s}
.sheet.nodata{display:none}
section{margin-bottom:40px}
h2{font-family:var(--display);font-size:1.2rem;font-weight:650;letter-spacing:-.015em;margin:0 0 14px}
.hourly-scroll{overflow-x:auto;margin:0 -20px;padding:0 20px 6px;scrollbar-width:thin;-webkit-overflow-scrolling:touch}
.hourly-scroll svg{display:block}
.hourly text{fill:var(--ink);font-family:var(--body)}
.hourly .hr{fill:var(--muted);font-size:13px}
.hourly .tv{font-size:15px;font-weight:600}
.hourly .pp{fill:var(--rain);font-size:11.5px;font-weight:600}
.hourly .dl{fill:var(--muted);font-size:12px;font-weight:600}
.layout{display:grid;gap:40px}
@media (min-width:980px){.layout{grid-template-columns:minmax(330px,390px) 1fr;align-items:start}}

.days{list-style:none;margin:0;padding:0}
.day{display:grid;grid-template-columns:4.4rem 28px 2.6rem 2.4rem 1fr 2.4rem;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.day:last-child{border-bottom:0}
.dname{font-weight:600}
.day svg{width:28px;height:28px}
.pop{color:var(--rain);font-size:.82rem;font-weight:700}
.lo{color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.hi{font-weight:600;font-variant-numeric:tabular-nums}
.range{position:relative;height:6px;border-radius:3px;background:var(--soft)}
.range i{position:absolute;top:0;bottom:0;border-radius:3px}
.range b{position:absolute;top:50%;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:var(--paper);border:2px solid var(--ink)}

.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));grid-auto-flow:row dense;gap:1px;border:1px solid var(--line);border-radius:22px;overflow:hidden}
.tile{background:var(--paper);outline:1px solid var(--line);padding:18px 18px 20px;min-height:158px;display:flex;flex-direction:column;gap:4px}
@media (min-width:640px){.tile.wide{grid-column:span 2}}
.tile h3,.fact h3{margin:0 0 2px;font-size:.92rem;font-weight:600;color:var(--muted)}
.big{font-family:var(--display);font-size:2.1rem;font-weight:500;line-height:1.1;letter-spacing:-.025em}
.big small{font-size:.5em;font-weight:500;letter-spacing:0;color:var(--muted);margin-left:4px}
.lead{font-weight:600}
.note{color:var(--muted);font-size:.9rem;margin-top:auto;padding-top:6px}
.scale{height:6px;border-radius:3px;position:relative;margin:12px 0 2px}
.scale b{position:absolute;top:50%;width:13px;height:13px;margin:-6.5px 0 0 -6.5px;border-radius:50%;background:var(--paper);border:2.5px solid var(--ink)}
.nc{display:flex;align-items:flex-end;gap:6px;height:64px;margin-top:12px}
.nc span{flex:1;background:var(--rain);border-radius:5px 5px 2px 2px;min-height:4px}
.nc span.z{background:var(--soft)}
.nc span.past{opacity:.45}
.nc-l{display:flex;justify-content:space-between;color:var(--muted);font-size:.8rem;margin-top:6px}
.sun svg,.wind svg{display:block;width:100%;height:auto}
.sun text,.wind text{fill:var(--muted);font-family:var(--body);font-size:12px}
.wind-row{display:flex;align-items:center;gap:16px}
.wind-row svg{width:104px;flex:none}
.alert{color:var(--bad);font-weight:600}

/* ---------- Mode panels ---------- */
.mode-panel{border:1px solid var(--line);border-radius:26px;padding:22px 20px;display:grid;gap:26px}
.mode-panel[hidden]{display:none}
.verdict{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.verdict .badge{width:14px;align-self:stretch;border-radius:7px;background:var(--tone,var(--muted))}
.verdict.art{grid-template-columns:132px 1fr}
.verdict h2{font-size:clamp(1.55rem,4.2vw,2.3rem);font-weight:650;line-height:1.1;margin:0;letter-spacing:-.025em}
.verdict p{margin:8px 0 0;max-width:52ch}
.verdict .muted{color:var(--muted)}
.line-art{width:132px;height:auto;display:block}
.cloth{transform-box:fill-box;transform-origin:50% 0;animation:sway 3.2s ease-in-out infinite alternate}
.cloth.c2{animation-duration:2.7s;animation-delay:-.8s}
.cloth.c3{animation-duration:3.6s;animation-delay:-1.6s}
@keyframes sway{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
.flag{transform-box:fill-box;transform-origin:0 50%;animation:flap 1.6s ease-in-out infinite alternate}
@keyframes flap{from{transform:scaleX(.82) skewY(-5deg)}to{transform:scaleX(1) skewY(4deg)}}
.bob{transform-box:fill-box;transform-origin:50% 100%;animation:bob 3s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(-1.5px) rotate(-2deg)}to{transform:translateY(1.5px) rotate(2deg)}}
.strip-wrap h3{margin:0 0 10px;font-size:.92rem;font-weight:600;color:var(--muted)}
.strip{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(42px,1fr);gap:4px;overflow-x:auto;padding-bottom:4px}
.strip div{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:.76rem;color:var(--muted);font-variant-numeric:tabular-nums}
.strip i{display:block;width:100%;height:38px;border-radius:9px;background:var(--soft)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:.84rem;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;background:var(--c);vertical-align:-1px}
.s-good{background:var(--good)!important} .s-ok{background:var(--ok)!important} .s-poor{background:var(--poor)!important} .s-bad{background:var(--bad)!important} .s-rain{background:var(--rain)!important}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px 24px}
.fact{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:4px}
.fact .val{font-family:var(--display);font-size:1.45rem;font-weight:550;line-height:1.2;letter-spacing:-.015em}
.fact p{margin:0;color:var(--muted);font-size:.92rem}
.wins{list-style:none;margin:4px 0 0;padding:0;display:flex;flex-direction:column;gap:4px}
.wins li{font-weight:600}
.periods{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;border:1px solid var(--line);border-radius:18px;overflow:hidden}
.period{background:var(--paper);outline:1px solid var(--line);padding:14px 14px 16px;display:flex;flex-direction:column;gap:4px}
.period .ph{display:flex;justify-content:space-between;align-items:center;font-weight:600}
.period svg{width:30px;height:30px}
.period .pt{font-family:var(--display);font-size:1.5rem;font-weight:500}
.period p{margin:0;font-size:.9rem;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.chip{border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:.88rem}
.chip.best{border-color:var(--good);color:var(--good);font-weight:700}
.official{font-size:.9rem;color:var(--muted)}
.official a{font-weight:600;color:var(--ink)}
footer p{margin:0 0 6px}
footer .copy{margin-top:14px;font-weight:600;color:var(--ink)}
footer{color:var(--muted);font-size:.85rem;padding-top:8px;border-top:1px solid var(--line)}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;
  width:min(92vw,440px);padding:13px 18px;border-radius:16px;background:var(--ink);color:var(--paper);font-weight:500;line-height:1.4;
  box-shadow:0 14px 34px rgba(5,15,30,.35)}
.toast[hidden]{display:none}
#locate[aria-busy="true"] svg{animation:spin 1.2s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* fun extras */
.share{display:inline-flex;align-items:center;gap:9px;justify-self:start;background:#1FA855;color:#fff;font-weight:700;padding:12px 18px;border-radius:999px;text-decoration:none;box-shadow:0 6px 16px rgba(31,168,85,.28)}
.share svg{width:22px;height:22px}
.pantun{font-family:var(--display);font-size:1.08rem;line-height:1.55;color:var(--ink)!important}
.outfit{display:flex;flex-wrap:wrap;gap:12px;margin:4px 0}
.outfit span{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.8rem;color:var(--muted);min-width:56px;text-align:center}
.outfit svg{width:34px;height:34px}
.lvl{display:inline-block;padding:4px 12px;border-radius:999px;font-size:1rem;font-weight:700;color:#fff}
.lvl0{background:var(--good)} .lvl1{background:var(--ok);color:#2A2205} .lvl2{background:var(--bad)}
.score small{font-size:.5em;color:var(--muted);margin-left:2px}
.meter{height:8px;border-radius:4px;background:var(--soft);overflow:hidden;margin:4px 0 2px}
.meter i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--poor),var(--ok),var(--good))}
.meter.stars i{background:linear-gradient(90deg,#5B6B8C,#8E7CC3,#F2C14E)}
.countdown{color:var(--ink)}
.fish{display:grid;gap:18px;border-top:1px solid var(--line);padding-top:18px}
.fish-head{display:grid;grid-template-columns:72px 1fr;gap:14px;align-items:center}
.fish-head svg{width:72px;height:auto;animation:swim 2.4s ease-in-out infinite alternate}
@keyframes swim{from{transform:translateX(-3px) rotate(-3deg)}to{transform:translateX(3px) rotate(3deg)}}
.fish-head h3{margin:0;font-family:var(--display);font-size:1.3rem;font-weight:650}
.fish-best{margin:4px 0 0;font-weight:600}
.fish-list{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.fish-list li{display:grid;grid-template-columns:4.2rem 1fr;gap:10px;align-items:start}
.fish-list .st{color:#E2A62B;font-size:1.05rem;letter-spacing:1px}
.fish-list small{color:var(--muted)}
.caddie{display:grid;grid-template-columns:44px 1fr;gap:14px;align-items:start;border-top:1px solid var(--line);padding-top:16px}
.caddie svg{width:44px;height:44px}
.caddie h3{margin:0 0 4px;font-size:.92rem;font-weight:600;color:var(--muted)}
.caddie p{margin:0;font-weight:500}

/* animated sky */
.sky{position:relative;overflow:hidden}
.sky > .wrap{position:relative;z-index:1}
.sky-fx{position:absolute;inset:0;pointer-events:none;overflow:hidden}
/* keep the weather text readable: effects fade out behind the text column */
.sky-fx{-webkit-mask-image:linear-gradient(90deg,rgba(0,0,0,.28) 0%,rgba(0,0,0,.28) 42%,#000 68%);mask-image:linear-gradient(90deg,rgba(0,0,0,.28) 0%,rgba(0,0,0,.28) 42%,#000 68%)}
@media (max-width:640px){.sky-fx{-webkit-mask-image:linear-gradient(90deg,rgba(0,0,0,.35) 0%,rgba(0,0,0,.35) 55%,#000 85%);mask-image:linear-gradient(90deg,rgba(0,0,0,.35) 0%,rgba(0,0,0,.35) 55%,#000 85%)}}
.hero .greet,.hero .place,.hero .sub,.hero .temp,.hero .cond,.hero .meta,.hero .summary{text-shadow:0 1px 2px rgba(8,22,42,.28),0 4px 22px rgba(8,22,42,.26)}
.fx-sun{position:absolute;right:6%;top:-150px;width:460px;height:460px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,240,180,.60) 0%,rgba(255,214,120,.28) 28%,rgba(255,214,120,0) 64%);animation:glow 6s ease-in-out infinite alternate}
.fx-sun.dim{opacity:.45}

const TSTOPS = [[-15,[123,140,255]],[0,[90,167,232]],[12,[108,197,176]],[20,[185,214,90]],[26,[242,193,78]],[32,[239,138,60]],[40,[217,83,79]]];

  if (c <= TSTOPS[0][0]) return `rgb(${TSTOPS[0][1]})`;

    const [t1, c1] = TSTOPS[i];
    if (c <= t1){ const [t0, c0] = TSTOPS[i-1], f = (c - t0) / (t1 - t0); return `rgb(${c0.map((v,j)=>Math.round(v + (c1[j]-v)*f)).join(',')})`; }

function applySky(d){
  const c = d.current, kind = wmo(c.weather_code)[1], now = localNow().mins;
  const rise = minsOf(d.daily.sunrise[0]), set = minsOf(d.daily.sunset[0]);
  const dawn = Math.abs(now - rise) < 45, dusk = Math.abs(now - set) < 45;
  const wet = ['rain','drizzle','storm'].includes(kind), grey = kind === 'cloud' || kind === 'fog' || c.cloud_cover > 75;
  // [top, middle, bottom]: deep, saturated gradients; the whole page follows day and night
  let p, time;
  if (!c.is_day && !dawn && !dusk){
    time = wet || grey ? 'night-cloud' : 'night-clear';
    p = kind === 'storm' ? ['#0A0F1C','#141D30','#25314A']
      : wet ? ['#0B1220','#172338','#2A3A54']
      : grey ? ['#0D1526','#1A263D','#2E3D58']
      : ['#050B24','#0E1A44','#22336E'];

    time = 'twilight';
    p = wet || grey ? ['#2E3554','#5B5F80','#B08A86'] : dawn ? ['#22306E','#7A6FB0','#F4A97A'] : ['#1F2463','#7B4E92','#F28A5B'];
  } else {
    time = 'day';
    p = kind === 'storm' ? ['#2C3A4C','#465A70','#748A9F']
      : wet ? ['#3A5068','#587089','#93A8BC']
      : kind === 'fog' ? ['#7E8B98','#A3AEB9','#CED6DE']
      : grey ? ['#3E5F84','#6A8CB2','#B3C8DD']
      : kind === 'partly' ? ['#0F5FC6','#3D8DE0','#94C8F2']
      : ['#0A57C2','#2F86E0','#86C3F5'];
  }
  const bi = time === 'day' ? 'day' : time === 'twilight' ? (dawn ? 'dawn' : 'dusk') : 'night';
  paintSky(p, time, bi, skyFx(time, kind, c.cloud_cover, !!c.is_day));
}
// Animated sky: drifting clouds, sun glow, twinkling stars, falling rain, lightning, fog
function skyFx(time, kind, cc, day){
  let seed = 11; const R = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const night = time.startsWith('night');
  const wet = ['rain','drizzle','storm'].includes(kind);
  const cloudy = wet || ['partly','cloud','fog','snow'].includes(kind) || cc > 40;
  let h = '';
  if (time === 'twilight') h += '<div class="fx-sun low"></div>';
  else if (day && !wet && kind !== 'fog') h += `<div class="fx-sun${cloudy && kind !== 'partly' ? ' dim' : ''}"></div>`;
  if (night){
    const n = cloudy ? 10 : 34;
    for (let i = 0; i < n; i++) h += `<i class="fx-star" style="left:${(R()*100).toFixed(1)}%;top:${(R()*70).toFixed(1)}%;animation-duration:${(2 + R()*3).toFixed(1)}s;animation-delay:-${(R()*4).toFixed(1)}s;transform:scale(${(.6 + R()).toFixed(2)})"></i>`;
  }
  if (cloudy || kind === 'clear'){
    const n = kind === 'clear' ? (cc > 15 ? 2 : 0) : kind === 'partly' ? 4 : 6;
    const fill = wet ? (night ? '#5B6B82' : '#DDE5EE') : night ? '#AFC0DA' : '#FFFFFF';
    for (let i = 0; i < n; i++){
      const w = Math.round(150 + R()*240), top = (R()*58).toFixed(1), dur = Math.round(70 + R()*90);
      const op = ((night ? .10 : wet ? .45 : .32) + R()*.25).toFixed(2);
      h += `<svg class="fx-cloud" viewBox="4 6 17 14" style="width:${w}px;left:${(R()*90).toFixed(1)}%;top:${top}%;opacity:${op};animation-duration:${dur}s;animation-delay:-${Math.round(R()*dur)}s"><path d="M7.4 19.5h9.4a3.9 3.9 0 0 0 .5-7.8 5.5 5.5 0 0 0-10.6 1.2 3.3 3.3 0 0 0 .7 6.6z" fill="${fill}"/></svg>`;
    }
  }
  if (wet){
    const n = kind === 'drizzle' ? 26 : 56;
    for (let i = 0; i < n; i++) h += `<i class="fx-drop${kind === 'drizzle' ? ' fine' : ''}" style="left:${(R()*104).toFixed(1)}%;opacity:${(.25 + R()*.45).toFixed(2)};animation-duration:${((kind === 'drizzle' ? 1.3 : .7) + R()*.6).toFixed(2)}s;animation-delay:-${(R()*1.5).toFixed(2)}s"></i>`;
  }
  if (kind === 'storm') h += '<div class="fx-flash"></div>';
  if (kind === 'fog') h += '<div class="fx-fog"></div><div class="fx-fog f2"></div>';
  return h;
}
function paintSky(p, time, bi, fx){

const placeKey = p => `${(+p.lat).toFixed(2)},${(+p.lon).toFixed(2)}`;
async function getJSON(url){

}
async function loadPlace(place, opts = {}){
  const changed = !state.place || placeKey(state.place) !== placeKey(place);
  state.place = place;
  if (changed){ state.marine = null; state.farm = null; state.extraError = false; }
  if (!opts.quiet){
    $('#sheet').classList.add('loading');
    if (!state.data) $('#heroArea').innerHTML = `<p class="status">${esc(t('loading', place.name))}</p>`;
  }
  const p = new URLSearchParams({
    latitude: place.lat, longitude: place.lon, timezone: 'auto',
    forecast_days: 10, forecast_hours: 48, forecast_minutely_15: 8,
    current: 'temperature_2m,relative_humidity_2m,apparent_temperature,is_day,precipitation,weather_code,cloud_cover,pressure_msl,wind_speed_10m,wind_direction_10m,wind_gusts_10m,dew_point_2m,uv_index,visibility',
    hourly: 'pressure_msl,temperature_2m,apparent_temperature,relative_humidity_2m,precipitation_probability,precipitation,weather_code,is_day,cloud_cover,wind_speed_10m,wind_gusts_10m,shortwave_radiation,uv_index',
    daily: 'weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset,uv_index_max,precipitation_probability_max,precipitation_sum,daylight_duration',
    minutely_15: 'precipitation'
  });
  try{
    const [w, a] = await Promise.all([
      getJSON('https://api.open-meteo.com/v1/forecast?' + p),
      getJSON(`https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${place.lat}&longitude=${place.lon}&current=us_aqi,pm2_5,pm10&timezone=auto`).catch(() => null)
    ]);
    state.data = w; state.aqi = a; state.lastRefresh = Date.now();
    store.set('skyline.last', place);

    ensureExtras();
  }catch(err){
    if (opts.quiet) return;
    $('#sheet').classList.remove('loading');
    if (!state.data) $('#sheet').classList.add('nodata');
    $('#heroArea').innerHTML = `<div class="status">${esc(t('error'))}<br><button class="pill" id="retry" type="button">${esc(t('retry'))}</button></div>`;
    $('#retry').onclick = () => loadPlace(place);

async function ensureExtras(){
  const key = placeKey(state.place), p = state.place;
  const needMarine = (state.mode === 'nelayan' || state.mode === 'wisata') && !state.marine;
  const needFarm = (state.mode === 'petani' || state.mode === 'golf') && !state.farm;
  if (!needMarine && !needFarm){ renderMode(); return; }
  renderMode(true);
  try{
    if (needMarine){

function haversine(a, b, c, d){
  const R = 6371, r = x => x * Math.PI / 180;
  const dLat = r(c - a), dLon = r(d - b);
  const h = Math.sin(dLat/2)**2 + Math.cos(r(a))*Math.cos(r(c))*Math.sin(dLon/2)**2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
function nearestQuake(){
  if (!state.quakes || !state.quakes.list.length) return null;
  let best = null;
  for (const q of state.quakes.list){
    const [la, lo] = String(q.Coordinates || '').split(',').map(Number);
    if (isNaN(la) || isNaN(lo)) continue;
    const km = haversine(state.place.lat, state.place.lon, la, lo);
    if (!best || km < best.km) best = { q, km };
  }
  return best;
}

function windows(pred, from, to, minLen = 1){
  const out = []; let a = -1;
  for (let i = from; i <= to; i++){
    const ok = i < to && pred(i);
    if (ok && a < 0) a = i;
    if (!ok && a >= 0){ if (i - a >= minLen) out.push({ a, b: i - 1 }); a = -1; }
  }
  return out;
}

function countUp(el, target){
  const from = target - 6, t0 = performance.now(), dur = 700;
  const step = x => { const f = Math.min(1, (x - t0) / dur), e = 1 - Math.pow(1 - f, 3); el.textContent = Math.round(from + (target - from) * e); if (f < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}

function summary(d, i0){
  const H = d.hourly, end = Math.min(i0 + 12, H.time.length);
  let rainAt = -1;
  for (let i = i0; i < end; i++) if (H.precipitation_probability[i] >= 50){ rainAt = i; break; }
  let s = rainAt === -1 ? t('dry12') : rainAt <= i0 + 1 ? t('rainSoon') : t('rainFrom', hourStr(H.time[rainAt]));
  let hi = i0, lo = i0;
  for (let i = i0; i < end; i++){ if (H.temperature_2m[i] > H.temperature_2m[hi]) hi = i; if (H.temperature_2m[i] < H.temperature_2m[lo]) lo = i; }
  const cur = H.temperature_2m[i0];
  if (hi > i0 + 1 && H.temperature_2m[hi] - cur >= 1.5) s += t('warm', tFmt(H.temperature_2m[hi]), hourStr(H.time[hi]));
  else if (lo > i0 + 1 && cur - H.temperature_2m[lo] >= 1.5) s += t('cool', tFmt(H.temperature_2m[lo]), hourStr(H.time[lo]));
  else s += t('steady');
  return esc(s);
}

function smooth(pts){
  let d = `M${pts[0][0]},${pts[0][1].toFixed(1)}`;
  for (let i = 0; i < pts.length - 1; i++){
    const p0 = pts[i-1] || pts[i], p1 = pts[i], p2 = pts[i+1], p3 = pts[i+2] || p2;
    d += ` C${(p1[0]+(p2[0]-p0[0])/6).toFixed(1)},${(p1[1]+(p2[1]-p0[1])/6).toFixed(1)} ${(p2[0]-(p3[0]-p1[0])/6).toFixed(1)},${(p2[1]-(p3[1]-p1[1])/6).toFixed(1)} ${p2[0]},${p2[1].toFixed(1)}`;
  }
  return d;
}

function renderHourly(d, i0){
  const H = d.hourly, n = Math.min(48, H.time.length - i0), step = 60, w = n * step, h = 200;
  if (n < 2){ $('#hourly').innerHTML = ''; return; }
  const temps = H.temperature_2m.slice(i0, i0 + n);
  const tmin = Math.min(...temps), tmax = Math.max(...temps), span = (tmax - tmin) || 1;
  const y = v => 84 + (1 - (v - tmin) / span) * 52;
  const pts = temps.map((v, i) => [i * step + step / 2, y(v)]);
  const stops = temps.map((v, i) => `<stop offset="${(i / (n - 1) * 100).toFixed(1)}%" stop-color="${tempColor(v)}"/>`).join('');
  const line = smooth(pts);
  let out = `<svg class="hourly" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(t('h48'))}">
    <defs><linearGradient id="tg" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="${w}" y2="0">${stops}</linearGradient></defs>
    <path d="${line} L${pts[n-1][0]},146 L${pts[0][0]},146 Z" fill="url(#tg)" fill-opacity=".16"/>
    <path d="${line}" fill="none" stroke="url(#tg)" stroke-width="3" stroke-linecap="round"/>`;
  for (let i = 0; i < n; i++){
    const k = i0 + i, x = pts[i][0], tm = H.time[k], pp = H.precipitation_probability[k] ?? 0;
    if (i > 0 && tm.slice(11,13) === '00'){
      out += `<line x1="${i*step}" y1="4" x2="${i*step}" y2="${h-4}" stroke="var(--line)" stroke-dasharray="3 4"/><text class="dl" x="${i*step + 6}" y="198">${weekday(tm)}</text>`;
    }
    out += `<text class="hr" x="${x}" y="16" text-anchor="middle">${i === 0 ? t('now') : hourStr(tm)}</text>`;
    out += icon(wmo(H.weather_code[k])[1], !!H.is_day[k], { x: x - 13, y: 24, size: 26 });
    out += `<text class="tv" x="${x}" y="${(pts[i][1] - 10).toFixed(1)}" text-anchor="middle">${tFmt(temps[i])}</text>`;
    out += `<circle cx="${x}" cy="${pts[i][1].toFixed(1)}" r="${i === 0 ? 4.5 : 2.5}" fill="${i === 0 ? 'var(--paper)' : tempColor(temps[i])}" stroke="${tempColor(temps[i])}" stroke-width="2"/>`;
    const bh = Math.max(2, pp / 100 * 24);
    out += `<rect x="${x - 9}" y="${176 - bh}" width="18" height="${bh}" rx="3" fill="${pp >= 20 ? 'var(--rain)' : 'var(--soft)'}" opacity="${pp >= 20 ? .35 + pp/160 : 1}"/>`;
    if (pp >= 20) out += `<text class="pp" x="${x}" y="190" text-anchor="middle">${pp}%</text>`;
  }
  $('#hourly').innerHTML = out + '</svg>';
}

function renderDaily(d){
  const D = d.daily;
  const wmin = Math.min(...D.temperature_2m_min), wmax = Math.max(...D.temperature_2m_max), span = (wmax - wmin) || 1;
  const cur = d.current.temperature_2m;
  $('#days').innerHTML = D.time.map((tm, i) => {
    const lo = D.temperature_2m_min[i], hi = D.temperature_2m_max[i], pp = D.precipitation_probability_max[i] ?? 0;
    const left = (lo - wmin) / span * 100, width = Math.max(4, (hi - lo) / span * 100);
    const dot = i === 0 ? `<b style="left:${clamp((cur - wmin) / span * 100, 0, 100)}%"></b>` : '';
    return `<li class="day" aria-label="${esc(i === 0 ? t('today') : weekday(tm, true))}: ${esc(wmo(D.weather_code[i])[0])}, ${t('low')} ${tFmt(lo)}, ${t('high')} ${tFmt(hi)}${pp >= 20 ? `, ${pp}%` : ''}">
      <span class="dname">${esc(i === 0 ? t('today') : weekday(tm))}</span>
      ${icon(wmo(D.weather_code[i])[1], true)}
      <span class="pop">${pp >= 20 ? pp + '%' : ''}</span>
      <span class="lo">${tFmt(lo)}</span>
      <span class="range"><i style="left:${left}%;width:${width}%;background:linear-gradient(90deg,${tempColor(lo)},${tempColor(hi)})"></i>${dot}</span>
      <span class="hi">${tFmt(hi)}</span>
    </li>`;
  }).join('');
}

const uvIdx = u => u < 3 ? 0 : u < 6 ? 1 : u < 8 ? 2 : u < 11 ? 3 : 4;
const aqIdx = a => a <= 50 ? 0 : a <= 100 ? 1 : a <= 150 ? 2 : a <= 200 ? 3 : a <= 300 ? 4 : 5;

function renderTiles(d){
  const c = d.current, D = d.daily, now = localNow(), tiles = [];

  // Earthquake (BMKG), only for Indonesian locations
  const nq = inIndonesia(state.place) ? nearestQuake() : null;
  if (nq){
    const q = nq.q, hrs = q.DateTime ? Math.max(0, Math.round((Date.now() - new Date(q.DateTime).getTime()) / 3600000)) : null;
    tiles.push(`<div class="tile wide"><h3>${t('quake')}</h3>

  }

  // Next 2 hours
  const M = d.minutely_15;
  if (M && M.time && M.time.length){
    const s = startIdx(M.time, c.time, 16), vals = M.precipitation.slice(s, s + 8), max = Math.max(0.5, ...vals);
    const first = vals.findIndex(v => v > 0.05);
    let msg;
    if (first === -1) msg = t('noRain2');
    else if (first === 0){ const stop = vals.findIndex(v => v <= 0.05); msg = stop === -1 ? t('rainNowCont') : t('rainNowEase', clockStr(M.time[s + stop])); }
    else msg = t('rainStart', clockStr(M.time[s + first]));
    tiles.push(`<div class="tile wide"><h3>${t('next2')}</h3><div class="lead">${esc(msg)}</div>
      <div class="nc" aria-hidden="true">${vals.map(v => `<span class="${v <= 0.05 ? 'z' : ''}" style="height:${v <= 0.05 ? 4 : Math.max(10, v / max * 100)}%"></span>`).join('')}</div>
      <div class="nc-l"><span>${t('now')}</span><span>${t('h1')}</span><span>${t('h2')}</span></div></div>`);
  }

  // Sun arc
  const rise = minsOf(D.sunrise[0]), set = minsOf(D.sunset[0]);
  const p = clamp((now.mins - rise) / (set - rise), 0, 1), up = now.mins > rise && now.mins < set;
  const sx = 150 - 125 * Math.cos(Math.PI * p), sy = 92 - 74 * Math.sin(Math.PI * p);
  const dl = D.daylight_duration ? D.daylight_duration[0] : (set - rise) * 60;
  const sunNote = up ? t('dayLeft', Math.floor((set - now.mins)/60), (set - now.mins) % 60)
                : now.mins <= rise ? t('riseIn', Math.floor((rise - now.mins)/60), (rise - now.mins) % 60) : t('dayLen', Math.floor(dl/3600), Math.round(dl % 3600 / 60));
  tiles.push(`<div class="tile wide sun"><h3>${t('sun')}</h3>
    <svg viewBox="0 0 300 116" aria-label="${clockStr(D.sunrise[0])}, ${clockStr(D.sunset[0])}">
      <line x1="10" y1="92" x2="290" y2="92" stroke="var(--line)"/>
      <path d="M25 92 A125 74 0 0 1 275 92" fill="none" stroke="var(--line)" stroke-width="2" stroke-dasharray="4 5"/>
      ${up ? `<path d="M25 92 A125 74 0 0 1 ${sx.toFixed(1)} ${sy.toFixed(1)}" fill="none" stroke="#E9A23B" stroke-width="3" stroke-linecap="round"/>
              <circle cx="${sx.toFixed(1)}" cy="${sy.toFixed(1)}" r="9" fill="#F7C948" stroke="#E39A2E" stroke-width="2"/>` : ''}
      <text x="25" y="110" text-anchor="middle">${clockStr(D.sunrise[0])}</text>
      <text x="275" y="110" text-anchor="middle">${clockStr(D.sunset[0])}</text>
    </svg><div class="note">${esc(sunNote)}</div></div>`);

  // Wind
  const wd = c.wind_direction_10m, dial = t('dial');
  tiles.push(`<div class="tile wind"><h3>${t('wind')}</h3><div class="wind-row">
    <svg viewBox="0 0 120 120" aria-hidden="true">
      <circle cx="60" cy="60" r="46" fill="none" stroke="var(--line)" stroke-width="2"/>
      ${Array.from({length:24},(_,i)=>`<line x1="60" y1="16" x2="60" y2="${i%6===0?24:20}" stroke="var(--line)" stroke-width="${i%6===0?2:1}" transform="rotate(${i*15} 60 60)"/>`).join('')}
      <text x="60" y="11" text-anchor="middle">${dial[0]}</text><text x="114" y="64" text-anchor="middle">${dial[1]}</text>
      <text x="60" y="118" text-anchor="middle">${dial[2]}</text><text x="6" y="64" text-anchor="middle">${dial[3]}</text>
      <g transform="rotate(${wd + 180} 60 60)"><line x1="60" y1="88" x2="60" y2="36" stroke="var(--ink)" stroke-width="3" stroke-linecap="round"/><path d="M60 26 l9 14 h-18z" fill="var(--ink)"/></g>
    </svg>
    <div><div class="big">${speed(c.wind_speed_10m)}</div><div>${esc(t('windFrom', dir8(wd)))}</div></div></div>
    <div class="note">${esc(t('gusts', speed(c.wind_gusts_10m)))}</div></div>`);

  // UV
  const uv = c.uv_index ?? 0, ui = uvIdx(uv);
  tiles.push(`<div class="tile"><h3>${t('uv')}</h3><div class="big">${Math.round(uv)}<small>${t('uvCats')[ui]}</small></div>
    <div class="scale" style="background:linear-gradient(90deg,#6CC070,#F2D04B 30%,#F29A3B 55%,#E5533D 78%,#9B5FC0)"><b style="left:${clamp(uv/11*100,0,100)}%"></b></div>
    <div class="note">${esc(t('uvTips')[ui])} ${esc(t('uvPeak', Math.round(D.uv_index_max[0] ?? uv)))}</div></div>`);

  // Air quality
  const aq = state.aqi && state.aqi.current;
  if (aq && aq.us_aqi != null){
    const ai = aqIdx(aq.us_aqi);
    tiles.push(`<div class="tile"><h3>${t('aq')}</h3><div class="big">${Math.round(aq.us_aqi)}<small>${t('aqCats')[ai]}</small></div>
      <div class="scale" style="background:linear-gradient(90deg,#6CC070,#F2D04B 17%,#F29A3B 33%,#E5533D 50%,#9B5FC0 67%,#7E2E3C)"><b style="left:${clamp(aq.us_aqi/300*100,0,100)}%"></b></div>
      <div class="note">${esc(t('aqTips')[ai])} ${esc(t('pm', Math.round(aq.pm2_5)))}</div></div>`);
  } else {
    tiles.push(`<div class="tile"><h3>${t('aq')}</h3><div class="lead">${t('aqNA')}</div><div class="note">${t('aqNANote')}</div></div>`);
  }

  // Feels like
  const diff = c.apparent_temperature - c.temperature_2m;
  const fl = diff >= 2 ? (c.relative_humidity_2m >= 55 ? t('flHum') : t('flSun')) : diff <= -2 ? t('flWind') : t('flSame');
  tiles.push(`<div class="tile"><h3>${t('feelsT')}</h3><div class="big">${tFmt(c.apparent_temperature)}</div><div class="note">${fl}</div></div>`);

  // Humidity
  tiles.push(`<div class="tile"><h3>${t('hum')}</h3><div class="big">${Math.round(c.relative_humidity_2m)}%</div>
    <div class="note">${esc(t('dew', tFmt(c.dew_point_2m), c.dew_point_2m >= 21 ? t('muggy') : c.dew_point_2m <= 10 ? t('dryAir') : ''))}</div></div>`);

  // Rain today
  tiles.push(`<div class="tile"><h3>${t('rainToday')}</h3><div class="big">${rainAmt(D.precipitation_sum[0] ?? 0)}</div>
    <div class="note">${esc(t('rainTodayNote', D.precipitation_probability_max[0] ?? 0, rainAmt(D.precipitation_sum[1] ?? 0)))}</div></div>`);

  // Pressure & visibility
  tiles.push(`<div class="tile"><h3>${t('press')}</h3><div class="big">${press(c.pressure_msl)}</div>
    <div class="note">${c.pressure_msl < 1005 ? t('pLow') : c.pressure_msl > 1020 ? t('pHigh') : t('pNorm')}</div></div>`);
  if (c.visibility != null){
    tiles.push(`<div class="tile"><h3>${t('vis')}</h3><div class="big">${dist(c.visibility)}</div>
      <div class="note">${c.visibility >= 10000 ? t('visClear') : c.visibility >= 4000 ? t('visHaze') : t('visLow')}</div></div>`);
  }
  $('#tiles').innerHTML = tiles.join('');
}

/* ---------- Jemuran (laundry) ---------- */
function dryAt(i){
  const H = state.data.hourly;
  if (!H.is_day[i]) return { s:0, cat:'night' };
  const pp = H.precipitation_probability[i] ?? 0, pr = H.precipitation[i] ?? 0;
  if (pp >= 50 || pr >= 0.2) return { s:0, cat:'rain' };
  const sun = clamp((H.shortwave_radiation[i] ?? 0) / 650, 0, 1), hum = clamp((92 - H.relative_humidity_2m[i]) / 50, 0, 1);
  const wind = clamp(H.wind_speed_10m[i] / 18, 0, 1), temp = clamp((H.temperature_2m[i] - 18) / 14, 0, 1);
  let s = .4*sun + .3*hum + .15*wind + .15*temp;
  if (pp >= 30) s *= .6;
  return { s, cat: s >= .5 ? 'good' : s >= .3 ? 'ok' : 'poor' };
}
// Sky element shared by every illustration: sun, rain cloud, storm cloud or moon

  const wins = windows(i => ['good','ok'].includes(dryAt(i).cat), i0, end, 2);
  const nextWin = wins.find(w => w.a > i0) || wins[0];
  let tone, title, lines = [];
  if (!H.is_day[i0]){ tone = 'night'; title = t('jmNight'); lines.push(nextWin ? t('jmNext', winLabel(nextWin)) : t('jmNoWin')); }
  else if (cur.cat === 'rain' || (rainIdx >= 0 && rainIdx - i0 < 2)){ tone = 'bad'; title = t('jmBad'); lines.push(rainIdx > i0 ? t('jmUntil', hourStr(H.time[rainIdx])) : t('jmRainNow')); const nw = wins.find(w => w.a > i0 + 1); lines.push(nw ? t('jmNext', winLabel(nw)) : t('jmNoWin')); }

function sprayOk(i){
  const H = state.data.hourly, n = H.time.length;

  if (w < 2 || w > 15 || H.wind_gusts_10m[i] > 25 || H.temperature_2m[i] > 32) return false;
  for (let k = i; k <= i + 3 && k < n; k++) if ((H.precipitation_probability[k] ?? 0) > 30 || (H.precipitation[k] ?? 0) > 0.1) return false;
  return true;
}
function modePetani(){
  const d = state.data, H = d.hourly, D = d.daily, i0 = state.i0, end = Math.min(H.time.length, i0 + 48);

  // harvest drying: good hours per day (today + tomorrow)
  const perDay = {};
  for (let i = i0; i < end; i++){ const k = H.time[i].slice(0, 10); perDay[k] = perDay[k] || 0; if (dryAt(i).cat === 'good') perDay[k]++; }

  // heat stress today

  const hot = []; for (let i = i0; i < end && H.time[i].slice(0, 10) === today; i++) if ((H.apparent_temperature[i] ?? 0) >= 35) hot.push(i);

      <div class="nc-l"><span>${t('past7')}</span><span>${t('today')}</span><span>${t('next7')}</span></div></div>`;

  const harvestHtml = perDay[bestDay] > 0

}

/* ---------- Wisata (travel) ---------- */
function modeWisata(){
  const d = state.data, H = d.hourly, D = d.daily, i0 = state.i0, now = localNow();
  const planTomorrow = now.h >= 18, planDate = D.time[planTomorrow ? 1 : 0];
  const ranges = [[6, 10], [11, 14], [15, 17], [18, 21]], names = t('periods');
  const periods = ranges.map(([a, b], pi) => {
    const idx = []; H.time.forEach((x, i) => { const h = +x.slice(11, 13); if (i >= i0 && x.slice(0, 10) === planDate && h >= a && h <= b) idx.push(i); });
    if (!idx.length) return '';
    const pp = Math.max(...idx.map(i => H.precipitation_probability[i] ?? 0));
    const temp = idx.reduce((s, i) => s + H.temperature_2m[i], 0) / idx.length;
    const app = Math.max(...idx.map(i => H.apparent_temperature[i] ?? H.temperature_2m[i]));
    const code = Math.max(...idx.map(i => H.weather_code[i]));
    const night = pi === 3;
    const v = pp >= 60 ? (night ? t('vNightRain') : t('vRain')) : pp >= 30 ? (night ? t('vNightRain') : t('vUmbrella')) : night ? t('vNight') : app >= 35 ? t('vHot') : t('vBeach');
    return `<div class="period"><div class="ph"><span>${names[pi]}</span>${icon(wmo(code)[1], !night)}</div>
      <div class="pt">${tFmt(temp)}</div><p>${pp >= 20 ? `<span class="pop">${pp}%</span> ` : ''}${esc(v)}</p></div>`;
  }).join('');

  // Sunset odds
  const ss = D.sunset[planTomorrow ? 1 : 0], ssHour = ss.slice(0, 13);
  const si = H.time.findIndex(x => x.slice(0, 13) === ssHour);
  let chance = 1;
  if (si >= 0){ const cc = H.cloud_cover[si] ?? 50, pp = H.precipitation_probability[si] ?? 0; chance = pp >= 50 || cc > 80 ? 2 : cc >= 20 && cc <= 70 ? 0 : 1; }

  // Beach & surf
  const mi = marineIndex();
  let beach = fact(t('beach'), null, t('noSea'));
  if (mi && mi[H.time[i0]] != null && state.marine.hourly.wave_height[mi[H.time[i0]]] != null){
    const M = state.marine.hourly, m = mi[H.time[i0]], wave = M.wave_height[m];
    const sw = M.swell_wave_height ? (M.swell_wave_height[m] ?? wave) : wave, sp = M.swell_wave_period ? (M.swell_wave_period[m] ?? 0) : 0;
    const swim = wave < .8 ? t('swimOk') : wave < 1.5 ? t('swimCare') : t('swimNo');
    const surf = sw < .5 ? t('surfFlat') : sw < 1.2 ? t('surfBeginner') : sw <= 2.5 && sp >= 9 ? t('surfGood') : sw > 2.5 ? t('surfBig') : t('surfBeginner');
    beach = fact(t('beach'), `${meters(wave)} <small>${t('waveCats')[waveCat(wave)]}</small>`, esc(`${swim} ${surf} ${t('swell', meters(sw), Math.round(sp))}`));
  }

  // UV window
  const uvH = []; H.time.forEach((x, i) => { if (i >= i0 && x.slice(0, 10) === planDate && (H.uv_index[i] ?? 0) >= 8) uvH.push(i); });
  const uvText = uvH.length ? t('uvWindow', hourStr(H.time[uvH[0]]), endHourStr(H.time[uvH[uvH.length - 1]])) : t('uvLowDay');

  const wTone = !H.is_day[i0] ? 'night' : (H.precipitation_probability[i0] ?? 0) >= 50 ? 'bad' : (H.cloud_cover[i0] ?? 0) > 70 ? 'ok' : 'good';
  return verdict('ok', planTomorrow ? t('wsTomorrow') : t('wsToday'), `<p class="muted">${t('wsSub')}</p>`, sceneWisata(wTone))
    + `<div class="periods">${periods}</div>`
    + `<div class="facts">
      ${fact(t('sunset'), t('sunsetChance')[chance], esc(t('sunsetAt', clockStr(ss))))}
      ${beach}
      ${fact(t('sunProt'), null, esc(uvText))}
    </div>`;
}

/* ---------- Umum (overview) ---------- */
function modeUmum(){
  const d = state.data, H = d.hourly, i0 = state.i0, end = Math.min(H.time.length, i0 + 12), today = H.time[i0].slice(0, 10);
  const kind = wmo(H.weather_code[i0])[1], night = !H.is_day[i0];
  let maxPP = 0, storm = false;
  for (let i = i0; i < end; i++){ maxPP = Math.max(maxPP, H.precipitation_probability[i] ?? 0); if (wmo(H.weather_code[i])[1] === 'storm' && (H.precipitation_probability[i] ?? 0) >= 40) storm = true; }
  const wet = (H.precipitation_probability[i0] ?? 0) >= 50 || ['rain','drizzle','storm'].includes(kind);
  let tone, title;
  if (night){ tone = 'night'; title = wet ? t('umNightRain') : t('umNight'); }
  else if (storm){ tone = 'storm'; title = t('umStorm'); }
  else if (wet || maxPP >= 60){ tone = 'bad'; title = t('umRain'); }
  else if ((H.cloud_cover[i0] ?? 0) > 70){ tone = 'ok'; title = t('umCloudy'); }
  else { tone = 'good'; title = t('umSunny'); }
  const comfy = i => H.is_day[i] && (H.precipitation_probability[i] ?? 0) < 25 && (H.apparent_temperature[i] ?? 30) < 34;
  const todayEnd = (() => { let k = i0; while (k < H.time.length && H.time[k].slice(0, 10) === today) k++; return k; })();
  const best = windows(comfy, i0, todayEnd, 2).sort((a, b) => (b.b - b.a) - (a.b - a.a))[0];
  const app = d.current.apparent_temperature, ci = app >= 34 ? 0 : app >= 29 ? 1 : app >= 21 ? 2 : 3;
  const umb = maxPP >= 50 ? t('umUmbYes') : maxPP >= 25 ? t('umUmbMaybe') : t('umUmbNo');
  return verdict(tone === 'night' ? 'muted' : tone === 'storm' ? 'bad' : tone, title, `<p class="muted">${esc(summary(d, i0).replace(/&amp;/g,'&'))}</p>`, sceneUmum(tone))
    + `<div class="facts">
      ${fact(t('umBest'), best ? esc(`${hourStr(H.time[best.a])}–${endHourStr(H.time[best.b])}`) : null, best ? '' : t('umBestNone'))}
      ${fact(t('umUmb'), esc(umb), esc(t('umUmbNote', maxPP)))}
      ${fact(t('umComfort'), t('umComf')[ci], esc(t('umComfNote', tFmt(app))))}
    </div>`;
}

/* ---------- Golf ---------- */
function golfAt(i){
  const H = state.data.hourly;
  if (!H.is_day[i]) return 'night';
  const pp = H.precipitation_probability[i] ?? 0;
  if (wmo(H.weather_code[i])[1] === 'storm' && pp >= 30) return 'storm';
  const ws = H.wind_speed_10m[i], app = H.apparent_temperature[i] ?? H.temperature_2m[i];
  if (pp >= 60 || (H.precipitation[i] ?? 0) >= 1 || ws >= 35 || app >= 40) return 'poor';
  if (pp < 25 && ws < 20 && app < 34) return 'good';
  return 'ok';
}
function modeGolf(){
  const d = state.data, H = d.hourly, D = d.daily, c = d.current, i0 = state.i0, end = Math.min(H.time.length, i0 + 48);
  let stormSoon = false;
  for (let i = i0; i < Math.min(end, i0 + 6); i++) if (golfAt(i) === 'storm') stormSoon = true;
  const cur = golfAt(i0);
  let tone, title, sub;
  if (stormSoon){ tone = 'storm'; title = t('gfStorm'); sub = t('gfStormSub'); }
  else if (cur === 'night'){ tone = 'night'; title = t('gfNight'); sub = t('gfNightSub'); }
  else if (cur === 'good'){ tone = 'good'; title = t('gfGood'); sub = t('gfGoodSub'); }
  else if (cur === 'ok'){ tone = 'ok'; title = t('gfOk'); sub = t('gfOkSub'); }
  else { tone = 'bad'; title = t('gfBad'); sub = t('gfBadSub'); }
  // best start time: 18 holes take about 4.5 hours, so the next 5 hourly slots must all be daylight and playable
  const lim = Math.min(end, i0 + 36);
  const hourScore = i => {
    const g = golfAt(i); if (g === 'night' || g === 'storm' || g === 'poor') return null;
    const app = H.apparent_temperature[i] ?? H.temperature_2m[i];
    return (g === 'good' ? 2 : 1) - Math.max(0, app - 28) / 4 - H.wind_speed_10m[i] / 25 - (H.precipitation_probability[i] ?? 0) / 50;
  };
  const starts = [];
  for (let i = i0; i + 4 < lim; i++){
    let sum = 0, ok = true;
    for (let k = i; k <= i + 4; k++){ const sc = hourScore(k); if (sc == null){ ok = false; break; } sum += sc; }
    if (ok) starts.push({ i, sum });
  }
  starts.sort((a, b) => b.sum - a.sum || a.i - b.i);
  const best = starts[0], alt = best && starts.find(x => Math.abs(x.i - best.i) >= 4);
  const startLabel = i => `${dayLabel(H.time[i])} ${hourStr(H.time[i])}`;
  const finish = i => { const h = (+H.time[i].slice(11, 13) + 4) % 24; return clock(h, 30); };
  const teeText = best ? t('gfTee', startLabel(best.i), finish(best.i)) + (alt ? ' ' + t('gfAlt', startLabel(alt.i)) : '') : t('gfNoTee');

  const items = [];
  for (let i = i0; i < Math.min(end, i0 + 24); i++){
    const g = golfAt(i);
    items.push({ cls: { good:'s-good', ok:'s-ok', poor:'s-poor', storm:'s-bad', night:'' }[g], label: i === i0 ? t('now') : hourStr(H.time[i]).replace(/[.:]00$/, ''), tip: hourStr(H.time[i]) });
  }
  const lg = t('gfLegend');

  // wind: about 1 club per 16 km/h into the wind; a tailwind helps roughly half as much
  const ws = c.wind_speed_10m, gust = c.wind_gusts_10m, cw = t('clubWords');
  const head = ws < 8 ? 0 : clamp(Math.round(ws / 16 * 2) / 2, 0.5, 3), tail = clamp(Math.round(head), 1, 3) / 2;
  const windText = (head === 0 ? t('gfClub0') : head === 0.5 ? t('gfClubLight') : t('gfClub', cw[head] ?? head, cw[tail] ?? tail)) + ' ' + t('gusts', speed(gust)) + (gust - ws >= 15 ? ' ' + t('gfGusty') : '');

  // distance: about 0.33 m per °C above 21°, and about 2% further per 305 m (1,000 ft) of altitude
  const elev = Math.max(0, d.elevation ?? 0), DRIVE = 230;
  const tempM = (c.temperature_2m - 21) * 0.33, altM = DRIVE * 0.02 * (elev / 305), total = tempM + altM;
  const sign = v => v >= 0 ? '+' : '−';
  const len = v => metric() ? `${sign(v)}${Math.abs(v).toFixed(1).replace('.', state.lang === 'id' ? ',' : '.')} m` : `${sign(v)}${Math.abs(v * 1.094).toFixed(1)} yd`;
  const elevStr = metric() ? `${Math.round(elev)} m` : `${Math.round(elev * 3.28084)} ft`;

  // course: last 2 days of rain plus today
  let green = t('gfNormal'), rainNote = '';
  const rainToday = D.precipitation_sum[0] ?? 0;
  if (state.farm && state.farm.daily){
    const P = state.farm.daily.precipitation_sum, r2 = (P[5] || 0) + (P[6] || 0);
    green = r2 >= 30 ? t('gfSoaked') : (r2 >= 8 || (P[6] || 0) >= 5 || rainToday >= 5) ? t('gfWet') : (r2 < 1 && rainToday < 1 && c.relative_humidity_2m < 75) ? t('gfDry') : t('gfNormal');
    rainNote = t('gfRainRecent', rainAmt(r2), rainAmt(rainToday));
  } else if (rainToday >= 5) green = t('gfWet');

  let maxApp = -99; const today = H.time[i0].slice(0, 10);
  for (let i = i0; i < end && H.time[i].slice(0, 10) === today; i++) maxApp = Math.max(maxApp, H.apparent_temperature[i] ?? -99);
  const vt = tone === 'night' ? 'muted' : tone === 'storm' ? 'bad' : tone === 'bad' ? 'poor' : tone;
  return verdict(vt, title, `<p>${esc(sub)}</p><p class="muted">${esc(teeText)}</p>`, sceneGolf(tone, ws))
    + strip(items, t('gfStrip'), [['good', lg[0]], ['ok', lg[1]], ['poor', lg[2]], ['bad', lg[3]], ['soft', t('night')]])
    + `<div class="facts">
      ${fact(t('gfWind'), esc(t('gfWindV', speed(ws), dir8(c.wind_direction_10m))), esc(windText) + `<br><br>${esc(t('gfWindLocal'))}`)}
      ${fact(t('gfCarry'), len(total), esc(t('gfCarryParts', len(tempM), len(altM), elevStr)) + `<br><br>${esc(t('gfCarryNote'))}`)}
      ${fact(t('gfGreen'), null, esc(green) + (rainNote ? ' ' + esc(rainNote) : '') + `<br><br>${esc(t('gfGreenLocal'))}`)}
      ${fact(t('gfHeat'), `${t('uv')} ${Math.round(D.uv_index_max[0] ?? 0)}`, esc(maxApp >= 35 ? t('gfHot') : t('gfWarm')))}
    </div>`;
}

}

/* ---------- Jemuran: score + live countdown ---------- */
function extrasJemuran(){
  const H = state.data.hourly, i0 = state.i0, end = Math.min(H.time.length, i0 + 48);
  const targetDate = H.is_day[i0] ? H.time[i0].slice(0, 10) : (H.time.slice(i0).find(x => x.slice(0, 10) !== H.time[i0].slice(0, 10)) || H.time[i0]).slice(0, 10);
  let sum = 0, n = 0;
  for (let i = i0; i < end; i++){ if (H.time[i].slice(0, 10) !== targetDate || !H.is_day[i]) continue; sum += dryAt(i).s; n++; }
  const score = n ? Math.round(clamp((sum / n) / 0.7, 0, 1) * 10) : 0;
  const itemsTxt = score >= 8 ? t('jmItemsHeavy') : score >= 5 ? t('jmItemsDaily') : t('jmItemsLight');
  // countdown: to the first rain today, or to the next drying window
  let label = '', to = 0;
  if (H.is_day[i0]){
    for (let i = i0 + 1; i < end && H.is_day[i]; i++) if (dryAt(i).cat === 'rain'){ label = t('jmCdRain'); to = localToMs(H.time[i]); break; }
  }
  if (!label){
    const w = windows(i => ['good','ok'].includes(dryAt(i).cat), i0, end, 2).find(x => x.a > i0);
    if (w && (!H.is_day[i0] || dryAt(i0).cat === 'rain')){ label = t('jmCdStart'); to = localToMs(H.time[w.a]); }
  }
  return `<div class="facts">
    <div class="fact"><h3>${t('jmScore')}</h3><div class="val score">${score}<small>/10</small></div><div class="meter"><i style="width:${score * 10}%"></i></div><p>${esc(t('jmScoreFor', (dl => dl === t('today') || dl === t('tomorrow') ? dl.toLowerCase() : dl)(dayLabel(targetDate + 'T12:00'))))} ${itemsTxt}</p></div>

}

/* ---------- Nelayan: solunar fishing times ---------- */
const rad = x => x * Math.PI / 180, deg = x => x * 180 / Math.PI, norm360 = x => ((x % 360) + 360) % 360;
function moonPos(ms, lat, lon){
  const d = ms / 86400000 + 2440587.5 - 2451545.0;
  const L = norm360(218.316 + 13.176396 * d), M = norm360(134.963 + 13.064993 * d), F = norm360(93.272 + 13.229350 * d);
  const lam = rad(L + 6.289 * Math.sin(rad(M))), bet = rad(5.128 * Math.sin(rad(F))), e = rad(23.439);
  const ra = Math.atan2(Math.sin(lam) * Math.cos(e) - Math.tan(bet) * Math.sin(e), Math.cos(lam));
  const dec = Math.asin(Math.sin(bet) * Math.cos(e) + Math.cos(bet) * Math.sin(e) * Math.sin(lam));
  let ha = norm360(280.46061837 + 360.98564736629 * d + lon - deg(ra)); if (ha > 180) ha -= 360;
  const alt = deg(Math.asin(Math.sin(rad(lat)) * Math.sin(dec) + Math.cos(rad(lat)) * Math.cos(dec) * Math.cos(rad(ha))));
  return { ha, alt };
}
function solunarEvents(fromMs, hours, lat, lon){
  const ev = [], step = 5 * 60000;
  let prev = moonPos(fromMs - 2 * 3600000, lat, lon);
  for (let ms = fromMs - 2 * 3600000 + step; ms <= fromMs + hours * 3600000; ms += step){
    const cur = moonPos(ms, lat, lon);
    if (prev.ha < 0 && cur.ha >= 0) ev.push({ type:'major', ms });
    if (prev.ha > 90 && cur.ha < -90) ev.push({ type:'major', ms });
    if (prev.alt < 0.13 && cur.alt >= 0.13) ev.push({ type:'minor', ms });
    if (prev.alt >= 0.13 && cur.alt < 0.13) ev.push({ type:'minor', ms });
    prev = cur;
  }
  return ev;
}
function extrasNelayan(){
  const d = state.data, H = d.hourly, D = d.daily, p = state.place;
  const now = Date.now(), from = now - (now % 1800000);
  const ev = solunarEvents(from, 24, p.lat, p.lon);
  const suns = [];
  for (let k = 0; k < Math.min(3, D.sunrise.length); k++) suns.push({ rise: localToMs(D.sunrise[k]), set: localToMs(D.sunset[k]) });
  const hIdx = {}; H.time.forEach((x, i) => hIdx[x.slice(0, 13)] = i);
  const mp = moonPhase(), moonBonus = mp.lit < 10 || mp.lit > 90;
  const slots = [];
  for (let k = 0; k < 48; k++){
    const a = from + k * 1800000, mid = a + 900000, tags = new Set();
    let base = 0;
    if (ev.some(e => e.type === 'major' && Math.abs(mid - e.ms) <= 3600000)){ base += 3; tags.add('major'); }
    if (ev.some(e => e.type === 'minor' && Math.abs(mid - e.ms) <= 1800000)){ base += 2; tags.add('minor'); }
    for (const sn of suns){
      if (mid >= sn.rise - 1800000 && mid <= sn.rise + 3600000){ base += 2; tags.add('dawn'); }
      if (mid >= sn.set - 3600000 && mid <= sn.set + 1800000){ base += 2; tags.add('dusk'); }
    }
    let score = base;
    const i = hIdx[msToLocal(mid).slice(0, 13)];
    if (i != null){
      if (wmo(H.weather_code[i])[1] === 'storm') score = -99;
      if ((H.precipitation_probability[i] ?? 0) >= 70) score -= 2;
      if (H.wind_speed_10m[i] >= 30) score -= 1;
      const pr = H.pressure_msl;
      if (pr && pr[i + 3] != null){ const dp = pr[i + 3] - pr[i]; if (dp <= -1){ score += 1; tags.add('press'); } else if (dp >= 1.5) score -= 1; }
    }
    if (base > 0 && moonBonus){ score += 1; tags.add('moon'); }
    slots.push({ a, base, score, tags });
  }
  // group neighbouring good slots into windows
  const wins = [];
  let cur = null;
  slots.forEach(sl => {
    const good = sl.base > 0 && sl.score >= 2;
    if (good){ if (!cur) cur = { a: sl.a, b: sl.a + 1800000, score: sl.score, tags: new Set(sl.tags) }; else { cur.b = sl.a + 1800000; cur.score = Math.max(cur.score, sl.score); sl.tags.forEach(x => cur.tags.add(x)); } }
    else if (cur){ wins.push(cur); cur = null; }
  });
  if (cur) wins.push(cur);
  const top = wins.slice().sort((x, y) => y.score - x.score).slice(0, 3).sort((x, y) => x.a - y.a);
  const best = top.slice().sort((x, y) => y.score - x.score)[0];
  const stars = sc => sc >= 5 ? '★★★' : sc >= 3 ? '★★☆' : '★☆☆';
  const lbl = w => { const a = msToLocal(w.a), b = msToLocal(w.b); return `${dayLabel(a)} ${clockStr(a)}–${clockStr(b)}`; };
  const tagTxt = w => [...w.tags].map(x => t('fishTags')[x]).join(', ');
  const coastal = state.marine && !state.marine.inland && state.marine.hourly && state.marine.hourly.wave_height.some(v => v != null);
  const solTimes = type => ev.filter(e => e.type === type && e.ms >= now).map(e => clockStr(msToLocal(e.ms))).join(', ') || '–';
  return `<div class="fish">
    <div class="fish-head"><svg viewBox="0 0 64 40" aria-hidden="true"><path d="M6 20c8-12 26-14 38-4l12-8v24l-12-8C32 34 14 32 6 20z" fill="#3FA7D6"/><path d="M14 20c6-6 16-8 24-4" stroke="#BFE6F7" stroke-width="2" fill="none" stroke-linecap="round"/><circle cx="16" cy="18" r="2.4" fill="#16212C"/><path d="M30 12l4-6 4 7z" fill="#2E86B8"/></svg>
      <div><h3>${t('fish')}</h3>
      ${best ? `<p class="fish-best">${esc(t('fishBest', lbl(best)))} ${stars(best.score)}</p>` : `<p class="fish-best">${t('fishNone')}</p>`}
      <p class="muted">${coastal ? t('fishCoast') : t('fishInland')}</p></div></div>
    ${top.length ? `<ul class="fish-list">${top.map(w => `<li><span class="st">${stars(w.score)}</span><span><b>${esc(lbl(w))}</b><br><small>${esc(tagTxt(w))}</small></span></li>`).join('')}</ul>` : ''}
    <div class="facts">${fact(t('solunar'), esc(`${t('solMajor')} ${solTimes('major')}`), esc(`${t('solMinor')} ${solTimes('minor')}. ${t('solNote')}`))}</div>
  </div>`;
}

/* ---------- Wisata: golden hour, stars, rainbow ---------- */
function extrasWisata(){
  const d = state.data, H = d.hourly, D = d.daily, i0 = state.i0, end = Math.min(H.time.length, i0 + 48);
  const add = (sv, min) => clockStr(msToLocal(localToMs(sv) + min * 60000));
  const k = localNow().h >= 19 ? 1 : 0, sr = D.sunrise[k], ss = D.sunset[k];
  const golden = t('goldenV', `${clockStr(sr)}–${add(sr, 45)}`, `${add(ss, -45)}–${clockStr(ss)}`);
  const blue = [`${add(sr, -25)}–${clockStr(sr)}`, `${clockStr(ss)}–${add(ss, 25)}`];
  // stargazing tonight: from 1 h after sunset until 03:00
  const s0 = localToMs(D.sunset[0]) + 3600000, s1 = localToMs(D.time[1] + 'T03:00');
  let cc = 0, n = 0, pp = 0, bestH = null, bestC = 101;
  H.time.forEach((x, i) => { const m = localToMs(x); if (m >= s0 && m <= s1){ cc += H.cloud_cover[i] ?? 50; n++; pp = Math.max(pp, H.precipitation_probability[i] ?? 0); if ((H.cloud_cover[i] ?? 100) < bestC){ bestC = H.cloud_cover[i]; bestH = x; } } });
  const lit = moonPhase().lit;
  let st = n ? 10 * (1 - cc / n / 100) * (1 - 0.6 * lit / 100) : 0;
  if (pp >= 50) st -= 3;
  st = Math.round(clamp(st, 0, 10));
  const sl = st >= 7 ? 2 : st >= 4 ? 1 : 0;
  // rainbow: low sun (within about 2.5 h of sunrise or sunset) with showers around and some sunshine
  let rb = null, rbScore = 0;
  for (let i = i0; i < end && H.time[i].slice(0, 10) === H.time[i0].slice(0, 10); i++){
    if (!H.is_day[i]) continue;
    const m = localToMs(H.time[i]) + 1800000, nearSun = Math.min(Math.abs(m - localToMs(sr)), Math.abs(m - localToMs(ss))) <= 2.5 * 3600000;
    const p = H.precipitation_probability[i] ?? 0, c = H.cloud_cover[i] ?? 50, r = H.shortwave_radiation[i] ?? 0;
    const sc = nearSun && p >= 25 && p <= 75 && c >= 25 && c <= 85 && r >= 100 ? (p >= 40 ? 2 : 1) : 0;
    if (sc > rbScore){ rbScore = sc; rb = H.time[i]; }
  }
  return `<div class="facts">
    ${fact(t('golden'), esc(golden), esc(t('goldenNote', blue[0], blue[1])))}
    <div class="fact"><h3>${t('stars')}</h3><div class="val score">${st}<small>/10</small></div><div class="meter stars"><i style="width:${st * 10}%"></i></div><p>${t('starsLv')[sl]}. ${esc(t('starsNote', bestH ? hourStr(bestH) : ''))}${lit > 60 ? ' ' + t('starsMoon') : ''}</p></div>
    <div class="fact"><h3>${t('rainbow')}</h3><div class="val"><span class="lvl lvl${rbScore}">${t('rainbowLv')[rbScore]}</span></div><p>${esc(rb ? t('rainbowAt', hourStr(rb)) : t('rainbowNone'))}</p></div>
  </div>`;
}

/* ---------- Golf: caddie tip ---------- */
function extrasGolf(){
  const d = state.data, c = d.current, D = d.daily, H = d.hourly, i0 = state.i0;
  let r2 = 0; if (state.farm && state.farm.daily){ const P = state.farm.daily.precipitation_sum; r2 = (P[5] || 0) + (P[6] || 0); }
  let maxApp = -99; for (let i = i0; i < Math.min(H.time.length, i0 + 12); i++) maxApp = Math.max(maxApp, H.apparent_temperature[i] ?? -99);
  const tip = c.wind_speed_10m >= 20 ? t('cdWind') : (r2 >= 8 || (D.precipitation_sum[0] ?? 0) >= 5) ? t('cdWet') : maxApp >= 34 ? t('cdHot')
    : (d.elevation ?? 0) >= 500 ? t('cdHigh') : (localNow().h < 9 && c.relative_humidity_2m >= 85) ? t('cdDew') : t('cdCalm');
  return `<div class="caddie"><svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18" fill="#5CC46E"/><path d="M20 30V9" stroke="#fff" stroke-width="2" stroke-linecap="round"/><path d="M20 9l9 3.5-9 3.5z" fill="#E5533D"/><circle cx="13" cy="28" r="3" fill="#fff"/></svg><div><h3>${t('caddie')}</h3><p>${esc(tip)}</p></div></div>`;
}
const EXTRAS = { umum: extrasUmum, jemuran: extrasJemuran, petani: extrasPetani, nelayan: extrasNelayan, wisata: extrasWisata, golf: extrasGolf };

/* ================= Saved places ================= */
const isFav = p => state.favs.some(f => placeKey(f) === placeKey(p));
function toggleFav(){
  const p = state.place;
  state.favs = isFav(p) ? state.favs.filter(f => placeKey(f) !== placeKey(p)) : [...state.favs, { name:p.name, region:p.region, lat:p.lat, lon:p.lon }].slice(-8);
  store.set('skyline.favs', state.favs);
  const on = isFav(p), b = $('#star');
  b.setAttribute('aria-pressed', on); b.setAttribute('aria-label', on ? t('unsave') : t('save'));
  renderFavs();
}
function renderFavs(){
  const el = $('#favs');
  el.innerHTML = state.favs.filter(f => !state.place || placeKey(f) !== placeKey(state.place))
    .map(f => `<button class="pill" type="button" data-k="${placeKey(f)}">${esc(f.name)}</button>`).join('');
  el.querySelectorAll('button').forEach(b => b.onclick = () => { const f = state.favs.find(x => placeKey(x) === b.dataset.k); if (f) loadPlace(f); });
}

/* ================= Search ================= */
const q = $('#q'), list = $('#results'), combo = $('#combo');
let results = [], active = -1, timer, reqId = 0;
function closeList(){ list.hidden = true; combo.setAttribute('aria-expanded', 'false'); active = -1; q.removeAttribute('aria-activedescendant'); }
function drawList(){
  if (!results.length) list.innerHTML = `<li class="empty" role="option" aria-disabled="true">${esc(t('noMatch', q.value))}</li>`;
  else list.innerHTML = results.map((r, i) => `<li role="option" id="opt${i}" aria-selected="${i === active}" data-i="${i}">${esc(r.name)}<small>${esc(r.region)}</small></li>`).join('');
  list.hidden = false; combo.setAttribute('aria-expanded', 'true');
  if (active >= 0) q.setAttribute('aria-activedescendant', 'opt' + active);
}
async function search(term){
  const id = ++reqId;
  try{
    const j = await getJSON(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(term)}&count=6&language=${state.lang}&format=json`);
    if (id !== reqId) return;
    results = (j.results || []).map(x => ({ name: x.name, region: [x.admin1, x.country].filter(Boolean).join(', '), lat: x.latitude, lon: x.longitude }));
    active = results.length ? 0 : -1;
    drawList();
  }catch(e){ if (id === reqId){ results = []; list.innerHTML = `<li class="empty">${esc(t('searchDown'))}</li>`; list.hidden = false; } }
}
function choose(i){ const r = results[i]; if (!r) return; q.value = ''; closeList(); q.blur(); loadPlace(r); }
q.addEventListener('input', () => {
  clearTimeout(timer);
  const term = q.value.trim();
  if (term.length < 2){ closeList(); return; }
  timer = setTimeout(() => search(term), 220);
});
q.addEventListener('keydown', e => {
  if (list.hidden) return;
  if (e.key === 'ArrowDown'){ e.preventDefault(); active = Math.min(results.length - 1, active + 1); drawList(); }
  else if (e.key === 'ArrowUp'){ e.preventDefault(); active = Math.max(0, active - 1); drawList(); }
  else if (e.key === 'Enter'){ e.preventDefault(); choose(active < 0 ? 0 : active); }
  else if (e.key === 'Escape') closeList();
});
list.addEventListener('mousedown', e => { const li = e.target.closest('li[data-i]'); if (li){ e.preventDefault(); choose(+li.dataset.i); } });
q.addEventListener('blur', () => setTimeout(closeList, 120));

/* ================= Location ================= */
function toast(msg, ms = 5000){
  const el = $('#toast');
  el.textContent = msg; el.hidden = false;
  clearTimeout(toast.timer);
  if (ms) toast.timer = setTimeout(() => { el.hidden = true; }, ms);
}
function locateMe(){
  const btn = $('#locate');
  if (!window.isSecureContext){ toast(t('locInsecure'), 7000); return; }
  if (!navigator.geolocation){ toast(t('unsupported')); return; }
  btn.setAttribute('aria-busy', 'true'); btn.disabled = true;
  toast(t('locating'), 0);
  const done = () => { btn.removeAttribute('aria-busy'); btn.disabled = false; };
  const ok = async pos => {
    const lat = +pos.coords.latitude.toFixed(4), lon = +pos.coords.longitude.toFixed(4);
    let place = { name: t('yourLoc'), region:'', lat, lon };
    try{
      const j = await getJSON(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=${state.lang}`);
      const name = j.city || j.locality || j.principalSubdivision;
      if (name) place = { name, region: [j.principalSubdivision !== name ? j.principalSubdivision : '', j.countryName].filter(Boolean).join(', '), lat, lon };
    }catch(e){}
    done(); $('#toast').hidden = true;
    loadPlace(place);
  };
  const fail = err => { done(); toast(err.code === 1 ? t('locDenied') : t('locFail'), 7000); };
  // quick network-based fix first; if that times out, try once more with GPS
  navigator.geolocation.getCurrentPosition(ok, err => {
    if (err.code === 1) return fail(err);
    navigator.geolocation.getCurrentPosition(ok, fail, { enableHighAccuracy:true, timeout:15000, maximumAge:0 });
  }, { enableHighAccuracy:false, timeout:8000, maximumAge:600000 });
}
$('#locate').onclick = locateMe;

/* ================= Language & units ================= */
function applyStatic(){
  document.documentElement.lang = state.lang;
  q.placeholder = t('search'); q.setAttribute('aria-label', t('search'));
  $('#locate span').textContent = t('locate'); $('#locate').setAttribute('aria-label', t('locate'));
  $('#h-hourly').textContent = t('h48'); $('#h-daily').textContent = t('d10'); $('#h-now').textContent = t('cond');
  $('#hourly').setAttribute('aria-label', t('hourlyLabel'));
  $('#footer').innerHTML = `<p class="credits">${t('footer')}</p><p class="copy">&copy; ${new Date().getFullYear()} BMT | Berkat Maha Tinggi</p>`;
  if (typeof renderInstallLink === 'function') renderInstallLink();
  document.querySelectorAll('#langSeg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.l === state.lang));
  document.querySelectorAll('#unitSeg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.u === state.units));
}
document.querySelectorAll('#langSeg button').forEach(b => b.onclick = () => {
  if (state.lang === b.dataset.l) return;
  state.lang = b.dataset.l; store.set('skyline.lang', state.lang); applyStatic();
  if (state.data) render(false); else renderModes();
});
document.querySelectorAll('#unitSeg button').forEach(b => b.onclick = () => {
  if (state.units === b.dataset.u) return;
  state.units = b.dataset.u; store.set('skyline.units', state.units); applyStatic();
  if (state.data) render(false);
});
window.addEventListener('hashchange', () => { const m = location.hash.slice(1); if (MODES.includes(m) && m !== state.mode) setMode(m); });


/* ================= Installable app (PWA) ================= */
let installEvt = null;
const isStandalone = () => window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const isPhone = () => /android|iphone|ipad|ipod|mobile/i.test(navigator.userAgent) || (window.matchMedia('(pointer: coarse)').matches && window.innerWidth < 1024);
const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
function showInstall(force){
  if (isStandalone()) return;
  if (!force && (store.get('skyline.installLater', 0) > Date.now())) return;
  const ios = isIOS() && !installEvt;
  if (!installEvt && !ios) return;
  $('#installTitle').textContent = isPhone() ? t('instTitle') : t('instTitlePc');
  $('#installSub').textContent = ios ? t('instIos') : t('instSub');
  $('#installGo').textContent = ios ? t('instIosGo') : t('instGo');
  $('#installLater').textContent = t('instLater');
  $('#installLater').hidden = ios;
  $('#install').hidden = false;
}
function hideInstall(snoozeDays){
  $('#install').hidden = true;
  if (snoozeDays) store.set('skyline.installLater', Date.now() + snoozeDays * 86400000);
}
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault(); installEvt = e;
  renderInstallLink();
  if (isPhone()) setTimeout(() => showInstall(false), 15000);
});
window.addEventListener('appinstalled', () => { installEvt = null; hideInstall(0); renderInstallLink(); });
$('#installGo').onclick = async () => {
  if (installEvt){ installEvt.prompt(); const r = await installEvt.userChoice.catch(() => null); installEvt = null; hideInstall(r && r.outcome === 'accepted' ? 0 : 7); renderInstallLink(); }
  else hideInstall(30);
};
$('#installLater').onclick = () => hideInstall(7);
function renderInstallLink(){
  const f = $('#footer'); if (!f) return;
  let a = f.querySelector('.install-link');
  const can = !isStandalone() && (installEvt || isIOS());
  if (!can){ if (a) a.remove(); return; }
  if (!a){ a = document.createElement('button'); a.type = 'button'; a.className = 'install-link'; a.onclick = () => showInstall(true); f.appendChild(a); }
  a.textContent = '📲 ' + t('instFooter');
}
if (isIOS() && !isStandalone()) setTimeout(() => showInstall(false), 20000);
if ('serviceWorker' in navigator && location.protocol === 'https:'){
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
window.addEventListener('offline', () => toast(t('offline'), 6000));
window.addEventListener('online', () => { toast(t('online'), 3000); if (state.place) loadPlace(state.place, { quiet:true }); });

/* ================= Boot ================= */
applyStatic();
(() => {
  const h = new Date().getHours();
  if (h >= 19 || h < 5) paintSky(['#050B24','#0E1A44','#22336E'], 'night-clear', 'night');
  else if (h < 7) paintSky(['#22306E','#7A6FB0','#F4A97A'], 'twilight', 'dawn');
  else if (h >= 17) paintSky(['#1F2463','#7B4E92','#F28A5B'], 'twilight', 'dusk');
  else paintSky(['#0A57C2','#2F86E0','#86C3F5'], 'day', 'day');
})();
renderModes();
loadPlace(store.get('skyline.last', null) || DEFAULT_PLACE);
setInterval(() => { if (!document.hidden && state.place) loadPlace(state.place, { quiet:true }); }, 15 * 60 * 1000);
setInterval(() => { const g = $('#greet'); if (g) g.textContent = greeting(); }, 60 * 1000);
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && state.data && Date.now() - (state.lastRefresh || 0) > 10 * 60 * 1000) loadPlace(state.place, { quiet:true });
});
})();
</script>
