// Photon (OpenStreetMap) results: towns, villages, islands, beaches, mountains and landmarks, with tidy names
const PH_KEEP = /^(place|boundary|natural|tourism|leisure|aeroway|historic)$/;
const PH_SKIP = /^(hotel|guest_house|hostel|motel|apartment|chalet|camp_site|caravan_site|picnic_site|information|artwork|yes|house|tree|stone|wetland|scrub|wood|grassland)$/;
const PH_ISLAND = /^(java|jawa|sumatra|sumatera|borneo|kalimantan|sulawesi|celebes|lesser sunda islands|kepulauan sunda kecil|nusa tenggara|moluccas|kepulauan maluku|maluku islands|new guinea|papua island)$/i;
const PH_RANK = { city:300, town:260, municipality:250, island:240, state:220, administrative:200, county:200, volcano:200, beach:200, peak:180, national_park:180, village:140, suburb:120, region:120, attraction:150, aerodrome:150, bay:120, islet:120, quarter:90, neighbourhood:60, hamlet:50 };
function tidyPhoton(feats, term){
  const want = fold(term), out = [];
  const ok = f => f && f.properties && f.properties.name && f.geometry && PH_KEEP.test(f.properties.osm_key) && !PH_SKIP.test(f.properties.osm_value) && (f.properties.osm_key !== 'boundary' || f.properties.osm_value === 'administrative');
  const score = (f, i) => { const p = f.properties; return (p.countrycode === 'ID' ? 400 : 0) + (PH_RANK[p.osm_value] ?? 40) + (fold(stripPrefix(p.name)).startsWith(want) || fold(p.name).startsWith(want) ? 60 : 0) - i * 4; };
  const list = feats.filter(ok).map((f, i) => ({ f, s: score(f, i) })).sort((a, b) => b.s - a.s).map(x => x.f);
  for (const f of list){
    const p = f.properties, lon = f.geometry.coordinates[0], lat = f.geometry.coordinates[1];
    const name = stripPrefix(p.name) || p.name;
    const parts = [];
    [p.city, p.county, p.state].forEach(x => { if (!x || PH_ISLAND.test(x)) return; const v = shortAdm(x); if (fold(stripPrefix(v)) !== fold(name) && !parts.some(u => fold(stripPrefix(u)) === fold(stripPrefix(v)))) parts.push(v); });
    const region = [...parts.slice(-2), p.countrycode === 'ID' ? '' : p.country].filter(Boolean).join(', ') || p.country || '';
    if (out.some(o => fold(o.name) === fold(name) && (fold(o.region) === fold(region) || haversine(o.lat, o.lon, lat, lon) < 8))) continue;
    out.push({ name, region, lat: +lat.toFixed(4), lon: +lon.toFixed(4), cc: p.countrycode });
    if (out.length === 6) break;
  }
  return out;
}
async function search(term){
  const id = ++reqId;
  // popular places show at once; Photon (main) and the Open-Meteo list (backup) are added as each answers
  const pop = popularMatches(term);
  let A = null, B = null, doneA = false, doneB = false, drawn = false;
  const same = (x, y) => (fold(x.name) === fold(y.name) && haversine(x.lat, x.lon, y.lat, y.lon) < 15) || haversine(x.lat, x.lon, y.lat, y.lon) < 1.5;
  const update = () => {
    if (id !== reqId) return;
    const base = drawn ? results.slice() : pop.slice();
    const add = r => { if (base.length < 6 && !base.some(m => same(m, r))) base.push(r); };
    const a = A || [], b = B || [];
    a.filter(r => r.cc === 'ID').forEach(add); b.filter(r => r.cc === 'ID').forEach(add);
    a.filter(r => r.cc !== 'ID').forEach(add); b.filter(r => r.cc !== 'ID').forEach(add);
    if (!base.length){
      if (!(doneA && doneB)) return;                 // still waiting for the other search
      if (!A && !B){ list.innerHTML = `<li class="empty">${esc(t('searchDown'))}</li>`; list.hidden = false; return; }
    }
    results = base; if (active < 0 || active >= results.length) active = results.length ? 0 : -1;
    drawn = results.length > 0; drawList();
  };
  if (pop.length){ results = pop.slice(0, 6); active = 0; drawn = true; drawList(); }
  getJSON(`https://photon.komoot.io/api/?q=${encodeURIComponent(term)}&limit=15&lang=${state.lang === 'en' ? 'en' : 'default'}&lat=-2.5&lon=118&zoom=5`, 6000)
    .then(j => { A = tidyPhoton(j.features || [], term); }).catch(() => {}).then(() => { doneA = true; update(); });
  getJSON(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(term)}&count=25&language=${state.lang}&format=json`, 8000)
    .then(j => { B = tidyPlaces(j.results || [], term); }).catch(() => {}).then(() => { doneB = true; update(); });
}

  btn.setAttribute('aria-busy', 'true'); btn.disabled = true;
  toast(t('locating'), 0);
  const done = () => { btn.removeAttribute('aria-busy'); btn.disabled = false; };
  const ok = async pos => {
    const lat = +pos.coords.latitude.toFixed(4), lon = +pos.coords.longitude.toFixed(4);
    let place = { name: t('yourLoc'), region:'', lat, lon };
    try{
      const j = await getJSON(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=${state.lang}`);
      const name = j.city || j.locality || j.principalSubdivision;
      if (name) place = { name, region: [j.principalSubdivision !== name ? j.principalSubdivision : '', j.countryName].filter(Boolean).join(', '), lat, lon };
    }catch(e){}
    done(); $('#toast').hidden = true;
    loadPlace(place);
  };
  const fail = err => { done(); toast(err.code === 1 ? t('locDenied') : t('locFail'), 7000); };
  // quick network-based fix first; if that times out, try once more with GPS
  navigator.geolocation.getCurrentPosition(ok, err => {
    if (err.code === 1) return fail(err);
    navigator.geolocation.getCurrentPosition(ok, fail, { enableHighAccuracy:true, timeout:15000, maximumAge:0 });
  }, { enableHighAccuracy:false, timeout:8000, maximumAge:600000 });
}
$('#locate').onclick = locateMe;

/* ================= Language & units ================= */
function applyStatic(){
  document.documentElement.lang = state.lang;
  if ($('#brandTag')) $('#brandTag').textContent = state.lang === 'id' ? 'dan semua yang di atas sana' : 'and everything up there';
  q.placeholder = t('search'); q.setAttribute('aria-label', t('search'));
  $('#locate span').textContent = t('locate'); $('#locate').setAttribute('aria-label', t('locate')); try{ applyTheme(store.get('skyline.theme', 'auto'), false); }catch(e){ /* theme button not ready yet */ }
  $('#h-hourly').textContent = t('h48'); $('#h-daily').textContent = t('d10'); $('#h-now').textContent = t('cond');
  $('#hourly').setAttribute('aria-label', t('hourlyLabel'));
  $('#footer').innerHTML = `<p class="tagline">${state.lang === 'id' ? '☁️ Langit dan semua yang di atas sana' : '☁️ Langit and everything up there'}</p><p class="credits">${t('footer')}</p><p class="copy">&copy; ${new Date().getFullYear()} BMT | Berkat Maha Tinggi${ADS.client ? ` · <a href="privacy.html">${state.lang === 'id' ? 'Kebijakan Privasi' : 'Privacy Policy'}</a>` : ''}</p>`;
  if (typeof renderInstallLink === 'function') renderInstallLink();
  document.querySelectorAll('#langSeg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.l === state.lang));
  document.querySelectorAll('#unitSeg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.u === state.units));
}
document.querySelectorAll('#langSeg button').forEach(b => b.onclick = () => {
  if (state.lang === b.dataset.l) return;
  state.lang = b.dataset.l; store.set('skyline.lang', state.lang); applyStatic();
  if (state.data) render(false); else renderModes();
});
document.querySelectorAll('#unitSeg button').forEach(b => b.onclick = () => {
  if (state.units === b.dataset.u) return;
  state.units = b.dataset.u; store.set('skyline.units', state.units); applyStatic();
  if (state.data) render(false);
});
window.addEventListener('hashchange', () => { const m = location.hash.slice(1); if (MODES.includes(m) && m !== state.mode) setMode(m); });




/* ================= Light / dark theme (Otomatis → Terang → Gelap) ================= */
const THEME_ICONS = {
  auto:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor" stroke="none"/></svg>',
  light: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg>',
  dark:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>',
};
const THEME_NAMES = { id: { auto: 'Otomatis (terang siang, gelap malam)', light: 'Selalu terang', dark: 'Selalu gelap' }, en: { auto: 'Automatic (light by day, dark at night)', light: 'Always light', dark: 'Always dark' } };
function applyTheme(th, announce){
  document.documentElement.dataset.theme = th === 'light' || th === 'dark' ? th : (skyTime ? (skyTime === 'day' ? 'light' : 'dark') : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
  const b = $('#themeBtn'); if (!b) return;
  const nm = (THEME_NAMES[state.lang] || THEME_NAMES.id)[th];
  b.innerHTML = THEME_ICONS[th];
  const lbl = (state.lang === 'id' ? 'Tema: ' : 'Theme: ') + nm;
  b.setAttribute('aria-label', lbl); b.title = lbl;
  if (announce) toast(lbl, 2500);
}
$('#themeBtn').onclick = () => {
  const order = ['auto', 'light', 'dark'], cur = store.get('skyline.theme', 'auto');
  const next = order[(order.indexOf(cur) + 1) % order.length];
  store.set('skyline.theme', next); applyTheme(next, true);
};
applyTheme(store.get('skyline.theme', 'auto'), false);
/* ================= Google AdSense (only when ADS.client is set) ================= */
let adsStarted = false;
function initAds(){
  if (adsStarted || !ADS.client || !/^ca-pub-\d{10,20}$/.test(ADS.client) || location.protocol !== 'https:') return;
  adsStarted = true;
  const sc = document.createElement('script');
  sc.async = true; sc.crossOrigin = 'anonymous';
  sc.src = 'https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=' + ADS.client;
  document.head.appendChild(sc);
  [['adMid', ADS.slotMid], ['adEnd', ADS.slotEnd]].forEach(([id, slot]) => {
    const box = document.getElementById(id); if (!box || !/^\d{6,}$/.test(String(slot))) return;
    box.innerHTML = `<span class="ad-label">${state.lang === 'id' ? 'Iklan' : 'Advertisement'}</span><ins class="adsbygoogle" style="display:block" data-ad-client="${ADS.client}" data-ad-slot="${slot}" data-ad-format="auto" data-full-width-responsive="true"></ins>`;
    box.hidden = false;
    try{ (window.adsbygoogle = window.adsbygoogle || []).push({}); }catch(e){}
  });
}
/* ================= Installable app (PWA) ================= */
let installEvt = null;
const isStandalone = () => window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const isPhone = () => /android|iphone|ipad|ipod|mobile/i.test(navigator.userAgent) || (window.matchMedia('(pointer: coarse)').matches && window.innerWidth < 1024);
// Safari on a Mac (Safari 17+ can "Add to Dock"); Chrome/Edge on Mac use the normal install button instead
// iPhone in-app browsers (WhatsApp, Instagram, Facebook…) can't add to the home screen themselves
const isIOSInApp = () => isIOS() && !/Safari\//.test(navigator.userAgent) && !/CriOS|FxiOS|EdgiOS/.test(navigator.userAgent);
const isMacSafari = () => /Macintosh/.test(navigator.userAgent) && /Safari\//.test(navigator.userAgent) && !/Chrome|Chromium|CriOS|Edg|OPR|Firefox|FxiOS/.test(navigator.userAgent) && navigator.maxTouchPoints === 0;
const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
function showInstall(force){
  if (isStandalone()) return;
  if (!force && (store.get('skyline.installLater', 0) > Date.now())) return;
  const ios = isIOS() && !installEvt, mac = !installEvt && isMacSafari();
  if (!installEvt && !ios && !mac) return;
  $('#installTitle').textContent = isPhone() ? t('instTitle') : t('instTitlePc');
  $('#installSub').textContent = ios ? (isIOSInApp() ? t('instIosApp') : t('instIos')) : mac ? t('instMac') : isPhone() ? t('instSub') : t('instSubPc');
  $('#installGo').textContent = ios || mac ? t('instIosGo') : t('instGo');
  $('#installLater').textContent = t('instLater');
  $('#installLater').hidden = ios || mac;
  $('#install').hidden = false;
}
function hideInstall(snoozeDays){
  $('#install').hidden = true;
  if (snoozeDays) store.set('skyline.installLater', Date.now() + snoozeDays * 86400000);
}
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault(); installEvt = e;
  renderInstallLink();
  if (isPhone()) setTimeout(() => showInstall(false), 2000); // shortly after the weather appears
});
window.addEventListener('appinstalled', () => { installEvt = null; hideInstall(0); renderInstallLink(); });
// when the browser can't show its own install window, explain how to install from the browser menu
let installManual = false;
function showManualInstall(){
  installManual = true;
  $('#installSub').textContent = t('instManual');
  $('#installGo').textContent = t('instIosGo');
  $('#installLater').hidden = true;
  $('#install').hidden = false;
}
$('#installGo').onclick = async () => {
  if (installManual){ installManual = false; hideInstall(7); return; }
  if (installEvt){
    const ev = installEvt; installEvt = null;
    try{
      await ev.prompt();
      const r = await ev.userChoice;
      hideInstall(r && r.outcome === 'accepted' ? 0 : 7);
    }catch(e){ showManualInstall(); }
    renderInstallLink();
  }
  else if (isIOS() || isMacSafari()) hideInstall(30);
  else showManualInstall();
};
$('#installLater').onclick = () => hideInstall(7);
function renderInstallLink(){
  const f = $('#footer'); if (!f) return;
  let a = f.querySelector('.install-link');
  const can = !isStandalone() && (installEvt || isIOS() || isMacSafari());
  if (!can){ if (a) a.remove(); return; }
  if (!a){ a = document.createElement('button'); a.type = 'button'; a.className = 'install-link'; a.onclick = () => showInstall(true); f.appendChild(a); }
  a.textContent = (isPhone() ? '📲 ' : '💻 ') + t('instFooter');
}
if (isIOS() && !isStandalone()) setTimeout(() => showInstall(false), 2000);
if (isMacSafari() && !isStandalone()) setTimeout(() => showInstall(false), 4000);
renderInstallLink();
if ('serviceWorker' in navigator && location.protocol === 'https:'){
  window.addEventListener('load', () => {
    const hadController = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(reg => {
      // look for a new version whenever the app comes back to the screen
      document.addEventListener('visibilitychange', () => { if (!document.hidden) reg.update().catch(() => {}); });
    }).catch(() => {});
    // when a new version takes over, reload once so the phone shows it straight away
    let reloaded = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (!hadController || reloaded) return;
      reloaded = true; location.reload();
    });
  });
}
window.addEventListener('offline', () => toast(t('offline'), 6000));
window.addEventListener('online', () => { toast(t('online'), 3000); if (state.place) loadPlace(state.place, { quiet:true, force:true }); });

/* ================= Boot ================= */
applyStatic();
(() => {
  const h = new Date().getHours();
  if (h >= 19 || h < 5) paintSky(['#050B24','#0E1A44','#22336E'], 'night-clear', 'night');
  else if (h < 7) paintSky(['#22306E','#7A6FB0','#F4A97A'], 'twilight', 'dawn');
  else if (h >= 17) paintSky(['#1F2463','#7B4E92','#F28A5B'], 'twilight', 'dusk');
  else paintSky(['#0A57C2','#2F86E0','#86C3F5'], 'day', 'day');
})();
renderModes();
loadPlace(store.get('skyline.last', null) || DEFAULT_PLACE);
setInterval(() => { if (!document.hidden && state.place) loadPlace(state.place, { quiet:true, force:true }); }, 15 * 60 * 1000);
setInterval(() => { const g = $('#greet'); if (g) g.innerHTML = greetHtml(); const z = $('#zodiac'); if (z) z.innerHTML = zodiacHtml(); }, 60 * 1000);
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && state.data && Date.now() - (state.lastRefresh || 0) > 10 * 60 * 1000) loadPlace(state.place, { quiet:true, force:true });
});
})();
</script>
